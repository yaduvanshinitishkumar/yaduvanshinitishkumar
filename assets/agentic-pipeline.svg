<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Agentic AI engineering pipeline</title>
  <desc id="desc">An animated flow from user goal through planning, context, tools, evaluation and a reliable response.</desc>
  <defs>
    <!-- Fonts -->
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      .font-sans { font-family: 'Outfit', 'Inter', -apple-system, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    </style>

    <!-- Gradients -->
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#030712"/>
      <stop offset="0.5" stop-color="#0b0f19"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>

    <!-- Outer Border Beam Gradient -->
    <linearGradient id="outerBorderBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="35%" stop-color="#60A5FA" stop-opacity="1"/>
      <stop offset="70%" stop-color="#A78BFA" stop-opacity="1"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </linearGradient>

    <!-- Flow Connecting Beam Gradients -->
    <linearGradient id="flowBeamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="30%" stop-color="#22D3EE" stop-opacity="1"/>
      <stop offset="60%" stop-color="#A78BFA" stop-opacity="1"/>
      <stop offset="90%" stop-color="#34D399" stop-opacity="1"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </linearGradient>

    <!-- Individual Card Glow Gradients -->
    <linearGradient id="cardGoalBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop stop-color="#22D3EE" stop-opacity="0"/><stop offset="50%" stop-color="#22D3EE"/><stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cardPlannerBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop stop-color="#60A5FA" stop-opacity="0"/><stop offset="50%" stop-color="#60A5FA"/><stop offset="100%" stop-color="#60A5FA" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cardContextBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop stop-color="#818CF8" stop-opacity="0"/><stop offset="50%" stop-color="#818CF8"/><stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cardToolsBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop stop-color="#A78BFA" stop-opacity="0"/><stop offset="50%" stop-color="#A78BFA"/><stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cardEvalBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop stop-color="#C084FC" stop-opacity="0"/><stop offset="50%" stop-color="#C084FC"/><stop offset="100%" stop-color="#C084FC" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cardOutcomeBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop stop-color="#34D399" stop-opacity="0"/><stop offset="50%" stop-color="#34D399"/><stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </linearGradient>

    <!-- Radial Glows for background warmth -->
    <radialGradient id="glowGoal" cx="128" cy="159" r="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0.15"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowOutcome" cx="1072" cy="159" r="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34D399" stop-opacity="0.15"/><stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowMiddle" cx="600" cy="159" r="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60A5FA" stop-opacity="0.08"/><stop offset="1" stop-color="#60A5FA" stop-opacity="0"/>
    </radialGradient>

    <!-- Patterns -->
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#3b82f6" fill-opacity="0.06"/>
    </pattern>

    <!-- Glow filters -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="20" fill="url(#dotGrid)"/>

  <!-- Background Glows -->
  <circle cx="128" cy="159" r="180" fill="url(#glowGoal)"/>
  <circle cx="1072" cy="159" r="180" fill="url(#glowOutcome)"/>
  <circle cx="600" cy="159" r="300" fill="url(#glowMiddle)"/>

  <!-- Title & Subtitle -->
  <g class="font-sans" transform="translate(52, 48)">
    <text x="0" y="0" fill="#F8FAFC" font-size="20" font-weight="700" letter-spacing="-0.5">AGENTIC SYSTEM — ENGINEERING FLOW</text>
    <text x="0" y="24" fill="#64748B" font-size="12" font-weight="600" letter-spacing="1.5">EVERY DECISION IS BOUNDED, OBSERVABLE, AND EVALUATED</text>
  </g>

  <!-- Flow Connector Path (Animated Beams) -->
  <!-- Base track -->
  <path d="M128 159H1072" stroke="#1e293b" stroke-width="2" stroke-opacity="0.6"/>
  <!-- Glowing Overlay Beam -->
  <path id="flowPath" d="M128 159H1072" stroke="url(#flowBeamGrad)" stroke-width="3" stroke-dasharray="120 700" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" values="820;0" dur="5s" repeatCount="indefinite" />
  </path>

  <!-- Flying Glowing Particles -->
  <g filter="url(#softGlow)">
    <circle r="4" fill="#22D3EE">
      <animateMotion dur="5.5s" repeatCount="indefinite"><mpath href="#flowPath"/></animateMotion>
    </circle>
    <circle r="3" fill="#A78BFA">
      <animateMotion dur="5.5s" begin="-1.8s" repeatCount="indefinite"><mpath href="#flowPath"/></animateMotion>
    </circle>
    <circle r="3" fill="#34D399">
      <animateMotion dur="5.5s" begin="-3.6s" repeatCount="indefinite"><mpath href="#flowPath"/></animateMotion>
    </circle>
  </g>

  <!-- Bento Cards -->
  <g class="font-sans">
    <!-- Card 1: GOAL -->
    <g transform="translate(48, 112)">
      <rect width="160" height="94" rx="15" fill="#080D16" fill-opacity="0.8" stroke="#1e293b" stroke-width="1.5"/>
      <rect width="160" height="94" rx="15" fill="none" stroke="url(#cardGoalBeam)" stroke-width="2" stroke-dasharray="50 450">
        <animate attributeName="stroke-dashoffset" values="500;0" dur="4s" repeatCount="indefinite" />
      </rect>
      <!-- Icon & Text -->
      <g transform="translate(0, 0)">
        <circle cx="26" cy="27" r="10" fill="#22D3EE" fill-opacity="0.1" stroke="#22D3EE" stroke-width="1"/>
        <circle cx="26" cy="27" r="4" fill="#22D3EE" filter="url(#softGlow)"/>
        <text x="44" y="32" fill="#F8FAFC" font-size="14" font-weight="700">GOAL</text>
        <text x="18" y="60" fill="#94A3B8" font-size="11.5">Intent, authority,</text>
        <text x="18" y="76" fill="#94A3B8" font-size="11.5">success boundaries</text>
      </g>
    </g>

    <!-- Card 2: PLANNER -->
    <g transform="translate(236, 112)">
      <rect width="160" height="94" rx="15" fill="#080D16" fill-opacity="0.8" stroke="#1e293b" stroke-width="1.5"/>
      <rect width="160" height="94" rx="15" fill="none" stroke="url(#cardPlannerBeam)" stroke-width="2" stroke-dasharray="50 450">
        <animate attributeName="stroke-dashoffset" values="500;0" dur="4s" begin="0.6s" repeatCount="indefinite" />
      </rect>
      <!-- Icon & Text -->
      <g transform="translate(0, 0)">
        <circle cx="26" cy="27" r="10" fill="#60A5FA" fill-opacity="0.1" stroke="#60A5FA" stroke-width="1"/>
        <path d="M18 27H26M26 27L31 22M26 27L31 32" stroke="#60A5FA" stroke-width="1.5" stroke-linecap="round" fill="none" />
        <circle cx="18" cy="27" r="1.5" fill="#60A5FA" />
        <circle cx="31" cy="22" r="1.5" fill="#60A5FA" />
        <circle cx="31" cy="32" r="1.5" fill="#60A5FA" />
        <text x="44" y="32" fill="#F8FAFC" font-size="14" font-weight="700">PLANNER</text>
        <text x="18" y="60" fill="#94A3B8" font-size="11.5">Decomposition &amp;</text>
        <text x="18" y="76" fill="#94A3B8" font-size="11.5">next-best action</text>
      </g>
    </g>

    <!-- Card 3: CONTEXT -->
    <g transform="translate(424, 112)">
      <rect width="160" height="94" rx="15" fill="#080D16" fill-opacity="0.8" stroke="#1e293b" stroke-width="1.5"/>
      <rect width="160" height="94" rx="15" fill="none" stroke="url(#cardContextBeam)" stroke-width="2" stroke-dasharray="50 450">
        <animate attributeName="stroke-dashoffset" values="500;0" dur="4s" begin="1.2s" repeatCount="indefinite" />
      </rect>
      <!-- Icon & Text -->
      <g transform="translate(0, 0)">
        <circle cx="26" cy="27" r="10" fill="#818CF8" fill-opacity="0.1" stroke="#818CF8" stroke-width="1"/>
        <path d="M18 22C18 20.5 34 20.5 34 22M18 22V32C18 33.5 34 33.5 34 32V22M18 27C18 28.5 34 28.5 34 27" stroke="#818CF8" stroke-width="1.2" stroke-linecap="round" fill="none" />
        <text x="44" y="32" fill="#F8FAFC" font-size="14" font-weight="700">CONTEXT</text>
        <text x="18" y="60" fill="#94A3B8" font-size="11.5">Retrieval, memory,</text>
        <text x="18" y="76" fill="#94A3B8" font-size="11.5">ranking, freshness</text>
      </g>
    </g>

    <!-- Card 4: TOOLS -->
    <g transform="translate(612, 112)">
      <rect width="160" height="94" rx="15" fill="#080D16" fill-opacity="0.8" stroke="#1e293b" stroke-width="1.5"/>
      <rect width="160" height="94" rx="15" fill="none" stroke="url(#cardToolsBeam)" stroke-width="2" stroke-dasharray="50 450">
        <animate attributeName="stroke-dashoffset" values="500;0" dur="4s" begin="1.8s" repeatCount="indefinite" />
      </rect>
      <!-- Icon & Text -->
      <g transform="translate(0, 0)">
        <circle cx="26" cy="27" r="10" fill="#A78BFA" fill-opacity="0.1" stroke="#A78BFA" stroke-width="1"/>
        <path d="M19 31L25 25M23 23L27 27M27 23C29 21 32 21 34 23C36 25 36 28 34 30C32 32 29 32 27 30L23 34" stroke="#A78BFA" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        <text x="44" y="32" fill="#F8FAFC" font-size="14" font-weight="700">TOOLS</text>
        <text x="18" y="60" fill="#94A3B8" font-size="11.5">APIs, data, code,</text>
        <text x="18" y="76" fill="#94A3B8" font-size="11.5">validated actions</text>
      </g>
    </g>

    <!-- Card 5: EVALUATOR -->
    <g transform="translate(800, 112)">
      <rect width="160" height="94" rx="15" fill="#080D16" fill-opacity="0.8" stroke="#1e293b" stroke-width="1.5"/>
      <rect width="160" height="94" rx="15" fill="none" stroke="url(#cardEvalBeam)" stroke-width="2" stroke-dasharray="50 450">
        <animate attributeName="stroke-dashoffset" values="500;0" dur="4s" begin="2.4s" repeatCount="indefinite" />
      </rect>
      <!-- Icon & Text -->
      <g transform="translate(0, 0)">
        <circle cx="26" cy="27" r="10" fill="#C084FC" fill-opacity="0.1" stroke="#C084FC" stroke-width="1"/>
        <path d="M18 22C22 22 26 19 26 19C26 19 30 22 34 22V27C34 31 26 35 26 35C26 35 18 31 18 27V22Z" stroke="#C084FC" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        <path d="M22 27L25 30L30 25" stroke="#C084FC" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        <text x="44" y="32" fill="#F8FAFC" font-size="14" font-weight="700">EVALUATOR</text>
        <text x="18" y="60" fill="#94A3B8" font-size="11.5">Quality, evidence,</text>
        <text x="18" y="76" fill="#94A3B8" font-size="11.5">safety, recovery</text>
      </g>
    </g>

    <!-- Card 6: OUTCOME -->
    <g transform="translate(988, 112)">
      <rect width="160" height="94" rx="15" fill="#080D16" fill-opacity="0.8" stroke="#1e293b" stroke-width="1.5"/>
      <rect width="160" height="94" rx="15" fill="none" stroke="url(#cardOutcomeBeam)" stroke-width="2" stroke-dasharray="50 450">
        <animate attributeName="stroke-dashoffset" values="500;0" dur="4s" begin="3.0s" repeatCount="indefinite" />
      </rect>
      <!-- Icon & Text -->
      <g transform="translate(0, 0)">
        <circle cx="26" cy="27" r="10" fill="#34D399" fill-opacity="0.1" stroke="#34D399" stroke-width="1"/>
        <path d="M18 24L23 29L32 18" stroke="#34D399" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        <circle cx="26" cy="27" r="10" stroke="#34D399" stroke-dasharray="2 3" stroke-width="0.8" fill="none" />
        <text x="44" y="32" fill="#F8FAFC" font-size="14" font-weight="700">OUTCOME</text>
        <text x="18" y="60" fill="#94A3B8" font-size="11.5">Reliable response</text>
        <text x="18" y="76" fill="#94A3B8" font-size="11.5">or safe escalation</text>
      </g>
    </g>
  </g>

  <!-- Footer Trace Label -->
  <text x="600" y="258" text-anchor="middle" fill="#64748B" class="font-mono" font-size="11.5" letter-spacing="1">trace_id: plan → retrieve → act → evaluate → respond</text>

  <!-- Outer Border Beam (Glow Ring) -->
  <rect x="0.5" y="0.5" width="1199" height="299" rx="20" fill="none" stroke="url(#outerBorderBeam)" stroke-width="2" stroke-dasharray="200 1300">
    <animate attributeName="stroke-dashoffset" values="1500;0" dur="10s" repeatCount="indefinite" />
  </rect>
  <rect x="0.75" y="0.75" width="1198.5" height="298.5" rx="19.25" stroke="#1e293b" stroke-width="1.5" stroke-opacity="0.6"/>
</svg>
