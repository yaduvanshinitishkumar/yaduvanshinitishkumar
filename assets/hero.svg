<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Nitish Kumar — Full Stack Engineering, Agentic AI, DevOps and Product Leadership</title>
  <desc id="desc">An animated engineering command center with intelligent agent and cloud platform activity.</desc>
  <defs>
    <!-- Fonts -->
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap');
      .font-sans { font-family: 'Outfit', 'Inter', -apple-system, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
      .text-glow { filter: drop-shadow(0 0 8px rgba(34, 211, 238, 0.3)); }
    </style>

    <!-- Gradients -->
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#030712"/>
      <stop offset="0.5" stop-color="#0b0f19"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    
    <linearGradient id="borderBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="25%" stop-color="#3b82f6" stop-opacity="1"/>
      <stop offset="50%" stop-color="#A78BFA" stop-opacity="1"/>
      <stop offset="75%" stop-color="#f43f5e" stop-opacity="0"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="terminalBorderBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0"/>
      <stop offset="30%" stop-color="#22D3EE" stop-opacity="1"/>
      <stop offset="70%" stop-color="#34D399" stop-opacity="1"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
    
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop stop-color="#22D3EE"/>
      <stop offset="45%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="meteorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="80%" stop-color="#60A5FA" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="1"/>
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glowCyan" cx="200" cy="100" r="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="1000" cy="260" r="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCenter" cx="600" cy="180" r="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3b82f6" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <!-- Dot Pattern -->
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#3b82f6" fill-opacity="0.08"/>
    </pattern>

    <!-- Filters -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="360" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="20" fill="url(#dotGrid)"/>

  <!-- Glowing Ambiance -->
  <rect width="1200" height="360" rx="20" fill="url(#glowCyan)"/>
  <rect width="1200" height="360" rx="20" fill="url(#glowViolet)"/>
  <rect width="1200" height="360" rx="20" fill="url(#glowCenter)"/>

  <!-- Shooting Stars / Meteors -->
  <g opacity="0.6">
    <path d="M-100 -100 L100 100" stroke="url(#meteorGrad)" stroke-width="2">
      <animateTransform attributeName="transform" type="translate" values="-200 -200;1400 1400" dur="6s" repeatCount="indefinite" />
    </path>
    <path d="M-100 -100 L100 100" stroke="url(#meteorGrad)" stroke-width="1.5">
      <animateTransform attributeName="transform" type="translate" values="-500 -500;1200 1200" dur="9s" begin="2s" repeatCount="indefinite" />
    </path>
    <path d="M-100 -100 L100 100" stroke="url(#meteorGrad)" stroke-width="2">
      <animateTransform attributeName="transform" type="translate" values="-300 -300;1500 1500" dur="12s" begin="4.5s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Left Content (Personal Branding) -->
  <g class="font-sans" transform="translate(68, 0)">
    <!-- Subtitle Category Tag -->
    <text x="0" y="74" fill="#94A3B8" font-size="13" font-weight="700" letter-spacing="3" opacity="0.85">FULL STACK  •  AGENTIC AI  •  DEVOPS  •  PRODUCT</text>
    
    <!-- Nitish Kumar Title -->
    <text x="0" y="142" fill="url(#textGrad)" font-size="62" font-weight="800" letter-spacing="-1" class="text-glow">Nitish Kumar</text>
    
    <!-- Accent Line -->
    <rect x="0" y="162" width="480" height="2" rx="1" fill="url(#textGrad)" opacity="0.8"/>
    
    <!-- Description -->
    <text x="0" y="206" fill="#F1F5F9" font-size="20" font-weight="500" opacity="0.95">I architect products, AI systems, and cloud platforms.</text>
    <text x="0" y="238" fill="#94A3B8" font-size="15" font-weight="400" opacity="0.9">Engineering Leadership  /  AI Reliability  /  GitOps  /  Technical Education</text>

    <!-- Operational Status Pill -->
    <g transform="translate(0, 268)">
      <rect width="270" height="34" rx="17" fill="#0f172a" fill-opacity="0.6" stroke="#1e293b" stroke-width="1.5"/>
      <rect width="270" height="34" rx="17" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="80 340">
        <animate attributeName="stroke-dashoffset" values="420;0" dur="4s" repeatCount="indefinite" />
      </rect>
      <!-- Pulsing Dot -->
      <circle cx="20" cy="17" r="7" fill="#10B981" fill-opacity="0.25">
        <animate attributeName="r" values="5;9;5" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="20" cy="17" r="4" fill="#10B981">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="36" y="21" fill="#E2E8F0" font-size="12" font-weight="600" letter-spacing="1">BUILDING INTELLIGENT SYSTEMS</text>
    </g>
  </g>

  <!-- Right Content (Interactive Terminal Bento Card) -->
  <g transform="translate(700, 60)">
    <!-- Terminal Outer Shadow/Glow -->
    <rect x="-1" y="-1" width="442" height="242" rx="17" fill="none" stroke="url(#terminalBorderBeam)" stroke-width="2" stroke-dasharray="180 1200">
      <animate attributeName="stroke-dashoffset" values="0;-1380" dur="6s" repeatCount="indefinite" />
    </rect>
    <rect x="0" y="0" width="440" height="240" rx="16" fill="#090d16" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="440" height="240" rx="16" fill="url(#dotGrid)"/>

    <!-- Terminal Header -->
    <rect x="0.5" y="0.5" width="439" height="36" rx="15.5" fill="#111827" fill-opacity="0.5"/>
    <line x1="0" y1="36" x2="440" y2="36" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Windows Dot Controls -->
    <circle cx="20" cy="18" r="5" fill="#EF4444"/>
    <circle cx="36" cy="18" r="5" fill="#F59E0B"/>
    <circle cx="52" cy="18" r="5" fill="#10B981"/>
    <text x="220" y="23" text-anchor="middle" fill="#64748B" class="font-mono" font-size="11">nitish@engineering:~</text>

    <!-- Terminal Lines -->
    <g class="font-mono" font-size="13.5" transform="translate(24, 72)">
      <!-- Line 1 -->
      <g>
        <text x="0" y="0" fill="#22D3EE" font-weight="700">$</text>
        <text x="16" y="0" fill="#E2E8F0">agent</text>
        <text x="56" y="0" fill="#A78BFA">.run</text>
        <text x="88" y="0" fill="#E2E8F0">(</text>
        <text x="96" y="0" fill="#fb923c">goal</text>
        <text x="128" y="0" fill="#E2E8F0">)</text>
      </g>

      <!-- Line 2 -->
      <g transform="translate(0, 24)">
        <text x="0" y="0" fill="#64748B">→ planning... executing... evaluating</text>
        <circle cx="282" cy="-4" r="2.5" fill="#38BDF8">
          <animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" repeatCount="indefinite"/>
        </circle>
      </g>

      <!-- Line 3 -->
      <g transform="translate(0, 56)">
        <text x="0" y="0" fill="#22D3EE" font-weight="700">$</text>
        <text x="16" y="0" fill="#E2E8F0">platform</text>
        <text x="80" y="0" fill="#A78BFA">.deploy</text>
        <text x="136" y="0" fill="#E2E8F0">(</text>
        <text x="144" y="0" fill="#94A3B8">--gitops</text>
        <text x="208" y="0" fill="#E2E8F0">)</text>
      </g>

      <!-- Line 4 -->
      <g transform="translate(0, 80)">
        <text x="0" y="0" fill="#10B981">✓</text>
        <text x="16" y="0" fill="#64748B">resilient · observable · scalable</text>
      </g>

      <!-- Line 5 -->
      <g transform="translate(0, 112)">
        <text x="0" y="0" fill="#34D399" font-weight="700">$</text>
        <rect x="16" y="-12" width="8" height="15" fill="#34D399">
          <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>
  </g>

  <!-- Glowing Particles / Sparks -->
  <g filter="url(#softGlow)" opacity="0.8">
    <circle cx="650" cy="140" r="3" fill="#22D3EE">
      <animateTransform attributeName="transform" type="translate" values="0 0; 25 -25; 0 0" dur="5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;1;0.3" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle cx="1140" cy="240" r="3.5" fill="#A78BFA">
      <animateTransform attributeName="transform" type="translate" values="0 0; -30 20; 0 0" dur="7s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;1;0.2" dur="7s" repeatCount="indefinite" />
    </circle>
    <circle cx="720" cy="290" r="2.5" fill="#34D399">
      <animateTransform attributeName="transform" type="translate" values="0 0; 15 -15; 0 0" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="4s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Outer Border Beam (Glow Ring) -->
  <rect x="0.5" y="0.5" width="1199" height="359" rx="20" fill="none" stroke="url(#borderBeam)" stroke-width="2" stroke-dasharray="250 870">
    <animate attributeName="stroke-dashoffset" values="1120;0" dur="9s" repeatCount="indefinite" />
  </rect>
  <rect x="0.75" y="0.75" width="1198.5" height="358.5" rx="19.25" stroke="#1e293b" stroke-width="1.5" stroke-opacity="0.6"/>
</svg>
