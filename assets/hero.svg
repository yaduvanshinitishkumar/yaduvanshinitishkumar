<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Nitish Kumar — Full Stack Engineering, Agentic AI, DevOps and Product Leadership</title>
  <desc id="desc">An animated engineering command center with intelligent agent and cloud platform activity.</desc>
  <defs>
    <linearGradient id="bg" x1="38" y1="22" x2="1168" y2="346" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.52" stop-color="#0D1728"/>
      <stop offset="1" stop-color="#160E2A"/>
    </linearGradient>
    <linearGradient id="accent" x1="220" y1="52" x2="1020" y2="308" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="glowCyan">
      <stop stop-color="#22D3EE" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet">
      <stop stop-color="#A78BFA" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#93C5FD" stroke-opacity="0.055"/>
    </pattern>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="terminalClip"><rect x="728" y="86" width="384" height="198" rx="16"/></clipPath>
  </defs>

  <rect width="1200" height="360" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="22" fill="url(#grid)"/>
  <circle cx="170" cy="90" r="240" fill="url(#glowCyan)">
    <animate attributeName="r" values="220;270;220" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1070" cy="300" r="260" fill="url(#glowViolet)">
    <animate attributeName="r" values="260;215;260" dur="9s" repeatCount="indefinite"/>
  </circle>

  <g opacity="0.75">
    <path d="M710 51C785 18 874 22 935 62" stroke="url(#accent)" stroke-opacity="0.35" stroke-dasharray="5 11">
      <animate attributeName="stroke-dashoffset" values="0;-64" dur="5s" repeatCount="indefinite"/>
    </path>
    <circle cx="710" cy="51" r="4" fill="#22D3EE" filter="url(#softGlow)"/>
    <circle cx="935" cy="62" r="4" fill="#A78BFA" filter="url(#softGlow)"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="74" y="78" fill="#8B949E" font-size="15" font-weight="650" letter-spacing="2.4">FULL STACK  •  AGENTIC AI  •  DEVOPS  •  PRODUCT</text>
    <text x="70" y="151" fill="#F8FAFC" font-size="58" font-weight="700">Nitish Kumar</text>
    <rect x="72" y="174" width="510" height="3" rx="1.5" fill="url(#accent)">
      <animate attributeName="width" values="0;510;510" keyTimes="0;0.65;1" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <text x="72" y="218" fill="#C9D1D9" font-size="21" font-weight="500">I architect products, AI systems, and cloud platforms.</text>
    <text x="72" y="257" fill="#8B949E" font-size="16">Engineering Leadership  /  AI Reliability  /  GitOps  /  Technical Education</text>

    <g transform="translate(72 288)">
      <rect width="262" height="34" rx="17" fill="#22D3EE" fill-opacity="0.11" stroke="#22D3EE" stroke-opacity="0.55"/>
      <circle cx="18" cy="17" r="5" fill="#34D399">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="32" y="22" fill="#DDF9FF" font-size="13" font-weight="650">BUILDING INTELLIGENT SYSTEMS</text>
    </g>
  </g>

  <g>
    <rect x="708" y="65" width="424" height="240" rx="20" fill="#080D16" stroke="url(#accent)" stroke-opacity="0.55"/>
    <rect x="709" y="66" width="422" height="39" rx="19" fill="#111827"/>
    <path d="M709 86H1131" stroke="#334155"/>
    <circle cx="734" cy="86" r="5" fill="#FB7185"/>
    <circle cx="752" cy="86" r="5" fill="#FBBF24"/>
    <circle cx="770" cy="86" r="5" fill="#34D399"/>
    <text x="920" y="91" text-anchor="middle" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">nitish@engineering:~</text>
    <g clip-path="url(#terminalClip)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">
      <text x="735" y="137" fill="#22D3EE">$</text>
      <text x="754" y="137" fill="#E2E8F0">agent.plan(goal)</text>
      <text x="735" y="169" fill="#64748B">→ tools · memory · retrieval · evals</text>
      <text x="735" y="204" fill="#A78BFA">$</text>
      <text x="754" y="204" fill="#E2E8F0">platform.deploy(--gitops)</text>
      <text x="735" y="236" fill="#64748B">✓ observable · resilient · scalable</text>
      <text x="735" y="271" fill="#34D399">$</text>
      <rect x="754" y="258" width="9" height="17" rx="1" fill="#34D399">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.45;0.5;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <g filter="url(#softGlow)">
    <circle cx="686" cy="120" r="4" fill="#22D3EE">
      <animateTransform attributeName="transform" type="translate" values="0 0;10 -16;0 0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1150" cy="237" r="4" fill="#A78BFA">
      <animateTransform attributeName="transform" type="translate" values="0 0;-12 14;0 0" dur="4.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <rect x="0.75" y="0.75" width="1198.5" height="358.5" rx="21.25" stroke="url(#accent)" stroke-opacity="0.28" stroke-width="1.5"/>
</svg>
