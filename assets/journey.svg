<svg width="1200" height="380" viewBox="0 0 1200 380" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Nitish Kumar engineering journey</title>
  <desc id="desc">A professional animated timeline from starting coding in Class 6 and freelancing in Class 11 to engineering leadership and Agentic AI.</desc>
  <defs>
    <!-- Fonts -->
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      .font-sans { font-family: 'Outfit', 'Inter', -apple-system, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    </style>

    <!-- Gradients -->
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#030712"/>
      <stop offset="0.5" stop-color="#0b0f19"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>

    <!-- Outer Border Beam Gradient -->
    <linearGradient id="outerBorderBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="35%" stop-color="#60A5FA" stop-opacity="1"/>
      <stop offset="70%" stop-color="#818CF8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>

    <!-- Timeline Path Gradient -->
    <linearGradient id="timelineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop stop-color="#22D3EE"/>
      <stop offset="35%" stop-color="#60A5FA"/>
      <stop offset="70%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>

    <!-- Individual Card Glow Gradients -->
    <linearGradient id="cardGoalBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop stop-color="#22D3EE" stop-opacity="0"/><stop offset="50%" stop-color="#22D3EE"/><stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cardFreelancerBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop stop-color="#60A5FA" stop-opacity="0"/><stop offset="50%" stop-color="#60A5FA"/><stop offset="100%" stop-color="#60A5FA" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cardLeaderBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop stop-color="#818CF8" stop-opacity="0"/><stop offset="50%" stop-color="#818CF8"/><stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cardTodayBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop stop-color="#A78BFA" stop-opacity="0"/><stop offset="50%" stop-color="#A78BFA"/><stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>

    <!-- Radial Glows for background warmth -->
    <radialGradient id="glowClass6" cx="177" cy="212" r="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0.12"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowClass11" cx="459" cy="212" r="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60A5FA" stop-opacity="0.10"/><stop offset="1" stop-color="#60A5FA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowLeader" cx="741" cy="212" r="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#818CF8" stop-opacity="0.10"/><stop offset="1" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowToday" cx="1023" cy="212" r="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA" stop-opacity="0.12"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>

    <!-- Dot Pattern -->
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#3b82f6" fill-opacity="0.06"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="380" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="20" fill="url(#dotGrid)"/>

  <!-- Background Glows -->
  <circle cx="177" cy="212" r="200" fill="url(#glowClass6)"/>
  <circle cx="459" cy="212" r="200" fill="url(#glowClass11)"/>
  <circle cx="741" cy="212" r="200" fill="url(#glowLeader)"/>
  <circle cx="1023" cy="212" r="200" fill="url(#glowToday)"/>

  <!-- Title & Subtitle -->
  <g class="font-sans" transform="translate(52, 48)">
    <text x="0" y="0" fill="#F8FAFC" font-size="20" font-weight="700" letter-spacing="-0.5">AN ENGINEERING JOURNEY BUILT EARLY</text>
    <text x="0" y="24" fill="#64748B" font-size="12" font-weight="600" letter-spacing="1.5">CURIOSITY → RESPONSIBILITY → LEADERSHIP → INTELLIGENT SYSTEMS</text>
  </g>

  <!-- Timeline Connection Line (Animated Beam) -->
  <!-- Base metal track -->
  <path d="M95 184H1105" stroke="#1e293b" stroke-width="3" stroke-opacity="0.6"/>
  <!-- Glowing Overlay (Pulsing Timeline Beam) -->
  <path id="timelinePath" d="M95 184H1105" stroke="url(#timelineGrad)" stroke-width="3" stroke-dasharray="100 800" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" values="900;0" dur="6s" repeatCount="indefinite"/>
  </path>

  <!-- Flying Glowing Particles -->
  <g filter="url(#softGlow)">
    <circle r="4.5" fill="#F8FAFC">
      <animateMotion dur="7s" repeatCount="indefinite"><mpath href="#timelinePath"/></animateMotion>
    </circle>
    <circle r="3" fill="#22D3EE">
      <animateMotion dur="7s" begin="-2.3s" repeatCount="indefinite"><mpath href="#timelinePath"/></animateMotion>
    </circle>
    <circle r="3" fill="#A78BFA">
      <animateMotion dur="7s" begin="-4.6s" repeatCount="indefinite"><mpath href="#timelinePath"/></animateMotion>
    </circle>
  </g>

  <!-- Milestone Cards (Bento Style) -->
  <g class="font-sans">
    <!-- Milestone 1: CLASS 6 -->
    <g transform="translate(55, 110)">
      <!-- Card Panel -->
      <rect width="245" height="205" rx="17" fill="#080D16" fill-opacity="0.8" stroke="#1e293b" stroke-width="1.5"/>
      <rect width="245" height="205" rx="17" fill="none" stroke="url(#cardGoalBeam)" stroke-width="2" stroke-dasharray="80 740">
        <animate attributeName="stroke-dashoffset" values="820;0" dur="5s" repeatCount="indefinite"/>
      </rect>
      <!-- Timeline Connector Ring -->
      <circle cx="40" cy="74" r="30" fill="none" stroke="#22D3EE" stroke-opacity="0.15">
        <animate attributeName="r" values="28;33;28" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="40" cy="74" r="25" fill="#090d16" stroke="#22D3EE" stroke-width="1.5"/>
      <!-- Icon (Code bracket) -->
      <g transform="translate(0, 0)">
        <path d="M34 69L30 74L34 79 M46 69L50 74L46 79 M38 78L42 68" stroke="#22D3EE" stroke-width="1.5" stroke-linecap="round" fill="none" />
      </g>
      <!-- Content -->
      <text x="78" y="66" fill="#22D3EE" font-size="12.5" font-weight="700" letter-spacing="1.2">CLASS 6</text>
      <text x="78" y="87" fill="#F8FAFC" font-size="17" font-weight="700">Started coding</text>
      <text x="26" y="128" fill="#94A3B8" font-size="12.5">Curiosity became a habit:</text>
      <text x="26" y="148" fill="#94A3B8" font-size="12.5">learn, build, break, debug,</text>
      <text x="26" y="168" fill="#94A3B8" font-size="12.5">understand, and try again.</text>
    </g>

    <!-- Milestone 2: CLASS 11 -->
    <g transform="translate(337, 110)">
      <rect width="245" height="205" rx="17" fill="#080D16" fill-opacity="0.8" stroke="#1e293b" stroke-width="1.5"/>
      <rect width="245" height="205" rx="17" fill="none" stroke="url(#cardFreelancerBeam)" stroke-width="2" stroke-dasharray="80 740">
        <animate attributeName="stroke-dashoffset" values="820;0" dur="5s" begin="1.25s" repeatCount="indefinite"/>
      </rect>
      <!-- Timeline Connector Ring -->
      <circle cx="40" cy="74" r="30" fill="none" stroke="#60A5FA" stroke-opacity="0.15">
        <animate attributeName="r" values="28;33;28" dur="2s" begin="0.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="40" cy="74" r="25" fill="#090d16" stroke="#60A5FA" stroke-width="1.5"/>
      <!-- Icon (Briefcase) -->
      <g transform="translate(0, 0)">
        <rect x="29" y="67" width="22" height="14" rx="2" stroke="#60A5FA" stroke-width="1.5" fill="none" />
        <path d="M36 67V64H44V67 M29 72H51" stroke="#60A5FA" stroke-width="1.5" fill="none" />
      </g>
      <!-- Content -->
      <text x="78" y="66" fill="#60A5FA" font-size="12.5" font-weight="700" letter-spacing="1.2">CLASS 11</text>
      <text x="78" y="87" fill="#F8FAFC" font-size="17" font-weight="700">Began freelancing</text>
      <text x="26" y="128" fill="#94A3B8" font-size="12.5">Real clients introduced scope,</text>
      <text x="26" y="148" fill="#94A3B8" font-size="12.5">communication, deadlines,</text>
      <text x="26" y="168" fill="#94A3B8" font-size="12.5">delivery, and ownership.</text>
    </g>

    <!-- Milestone 3: LEADERSHIP -->
    <g transform="translate(619, 110)">
      <rect width="245" height="205" rx="17" fill="#080D16" fill-opacity="0.8" stroke="#1e293b" stroke-width="1.5"/>
      <rect width="245" height="205" rx="17" fill="none" stroke="url(#cardLeaderBeam)" stroke-width="2" stroke-dasharray="80 740">
        <animate attributeName="stroke-dashoffset" values="820;0" dur="5s" begin="2.5s" repeatCount="indefinite"/>
      </rect>
      <!-- Timeline Connector Ring -->
      <circle cx="40" cy="74" r="30" fill="none" stroke="#818CF8" stroke-opacity="0.15">
        <animate attributeName="r" values="28;33;28" dur="2s" begin="1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="40" cy="74" r="25" fill="#090d16" stroke="#818CF8" stroke-width="1.5"/>
      <!-- Icon (Nodes / Hierarchy) -->
      <g transform="translate(0, 0)">
        <circle cx="40" cy="65" r="3.5" stroke="#818CF8" stroke-width="1.5" fill="none" />
        <circle cx="32" cy="79" r="3" stroke="#818CF8" stroke-width="1.5" fill="none" />
        <circle cx="48" cy="79" r="3" stroke="#818CF8" stroke-width="1.5" fill="none" />
        <path d="M40 69V73 M40 73H32V76 M40 73H48V76" stroke="#818CF8" stroke-width="1.2" fill="none" />
      </g>
      <!-- Content -->
      <text x="78" y="66" fill="#818CF8" font-size="12.5" font-weight="700" letter-spacing="1.2">LEADERSHIP</text>
      <text x="78" y="87" fill="#F8FAFC" font-size="17" font-weight="700">Systems &amp; teams</text>
      <text x="26" y="128" fill="#94A3B8" font-size="12.5">Scope expanded to product,</text>
      <text x="26" y="148" fill="#94A3B8" font-size="12.5">architecture, platforms, DevOps,</text>
      <text x="26" y="168" fill="#94A3B8" font-size="12.5">and cross-functional delivery.</text>
    </g>

    <!-- Milestone 4: TODAY -->
    <g transform="translate(901, 110)">
      <rect width="245" height="205" rx="17" fill="#080D16" fill-opacity="0.8" stroke="#1e293b" stroke-width="1.5"/>
      <rect width="245" height="205" rx="17" fill="none" stroke="url(#cardTodayBeam)" stroke-width="2" stroke-dasharray="80 740">
        <animate attributeName="stroke-dashoffset" values="820;0" dur="5s" begin="3.75s" repeatCount="indefinite"/>
      </rect>
      <!-- Timeline Connector Ring -->
      <circle cx="40" cy="74" r="30" fill="none" stroke="#A78BFA" stroke-opacity="0.15">
        <animate attributeName="r" values="28;33;28" dur="2s" begin="1.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="40" cy="74" r="25" fill="#090d16" stroke="#A78BFA" stroke-width="1.5"/>
      <!-- Icon (Rocket) -->
      <g transform="translate(0, 0)">
        <path d="M40 62C40 62 45 66 45 72V79L40 76L35 79V72C35 66 40 62 40 62Z" stroke="#A78BFA" stroke-width="1.5" fill="none" />
        <path d="M35 74L31 77V81L35 79 M45 74L49 77V81L45 79" stroke="#A78BFA" stroke-width="1.2" fill="none" />
      </g>
      <!-- Content -->
      <text x="78" y="66" fill="#A78BFA" font-size="12.5" font-weight="700" letter-spacing="1.2">TODAY</text>
      <text x="78" y="87" fill="#F8FAFC" font-size="16" font-weight="700">AI, DevOps &amp;</text>
      <text x="78" y="106" fill="#F8FAFC" font-size="16" font-weight="700">education</text>
      <text x="26" y="139" fill="#94A3B8" font-size="12.5">Building intelligent systems,</text>
      <text x="26" y="159" fill="#94A3B8" font-size="12.5">reliable delivery platforms,</text>
      <text x="26" y="179" fill="#94A3B8" font-size="12.5">products, teams, and clarity.</text>
    </g>
  </g>

  <!-- Footer Loop Text -->
  <text x="600" y="348" text-anchor="middle" fill="#64748B" class="font-mono" font-size="11.5" letter-spacing="1">the tools changed; the habit of learning by building did not</text>

  <!-- Outer Border Beam (Glow Ring) -->
  <rect x="0.5" y="0.5" width="1199" height="379" rx="20" fill="none" stroke="url(#outerBorderBeam)" stroke-width="2" stroke-dasharray="200 1400">
    <animate attributeName="stroke-dashoffset" values="1600;0" dur="10s" repeatCount="indefinite"/>
  </rect>
  <rect x="0.75" y="0.75" width="1198.5" height="378.5" rx="19.25" stroke="#1e293b" stroke-width="1.5" stroke-opacity="0.6"/>
</svg>
