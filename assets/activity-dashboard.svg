<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Nitish Kumar GitHub engineering activity dashboard</title>
  <desc id="desc">A large animated dashboard highlighting more than 6.1 thousand lifetime contributions, more than 575 contributions in 2026, six years on GitHub, and engineering leadership at Twiinify.</desc>
  <defs>
    <!-- Fonts -->
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      .font-sans { font-family: 'Outfit', 'Inter', -apple-system, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    </style>

    <!-- Gradients -->
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#030712"/>
      <stop offset="0.5" stop-color="#0b0f19"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>

    <!-- Outer Border Beam Gradient -->
    <linearGradient id="outerBorderBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0"/>
      <stop offset="35%" stop-color="#22D3EE" stop-opacity="1"/>
      <stop offset="70%" stop-color="#60A5FA" stop-opacity="1"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="liveStatusBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop stop-color="#34D399" stop-opacity="0"/><stop offset="50%" stop-color="#34D399"/><stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </linearGradient>

    <!-- Card Border Beams -->
    <linearGradient id="cardGoalBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop stop-color="#22D3EE" stop-opacity="0"/><stop offset="50%" stop-color="#22D3EE"/><stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cardContribBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop stop-color="#60A5FA" stop-opacity="0"/><stop offset="50%" stop-color="#60A5FA"/><stop offset="100%" stop-color="#60A5FA" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cardClockBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop stop-color="#818CF8" stop-opacity="0"/><stop offset="50%" stop-color="#818CF8"/><stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cardLeaderBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop stop-color="#A78BFA" stop-opacity="0"/><stop offset="50%" stop-color="#A78BFA"/><stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>

    <!-- Progress Bar Gradient -->
    <linearGradient id="progressBarGrad" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glowLeft" cx="150" cy="210" r="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0.12"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="1050" cy="210" r="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA" stop-opacity="0.12"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCenter" cx="600" cy="210" r="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60A5FA" stop-opacity="0.08"/><stop offset="1" stop-color="#60A5FA" stop-opacity="0"/>
    </radialGradient>

    <!-- Patterns -->
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#3b82f6" fill-opacity="0.06"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="24" fill="url(#dotGrid)"/>

  <!-- Background Glows -->
  <circle cx="150" cy="210" r="260" fill="url(#glowLeft)"/>
  <circle cx="1050" cy="210" r="260" fill="url(#glowRight)"/>
  <circle cx="600" cy="210" r="220" fill="url(#glowCenter)"/>

  <!-- Header Section -->
  <g class="font-sans" transform="translate(58, 46)">
    <!-- GitHub Logo Circular Badge -->
    <circle cx="20" cy="20" r="20" fill="#F8FAFC"/>
    <path fill="#0D1117" d="M20 6.5a13.8 13.8 0 0 0-4.36 26.9c.69.13.94-.3.94-.66v-2.57c-3.84.83-4.65-1.63-4.65-1.63-.63-1.6-1.53-2.03-1.53-2.03-1.25-.85.1-.84.1-.84 1.38.1 2.1 1.42 2.1 1.42 1.23 2.1 3.22 1.5 4 1.15.13-.89.48-1.5.88-1.85-3.06-.35-6.28-1.53-6.28-6.82 0-1.5.54-2.74 1.42-3.7-.14-.35-.61-1.75.14-3.64 0 0 1.16-.37 3.8 1.41A13.2 13.2 0 0 1 20 13.18c1.17 0 2.34.16 3.44.46 2.64-1.78 3.8-1.41 3.8-1.41.75 1.89.28 3.29.14 3.64.88.96 1.42 2.2 1.42 3.7 0 5.3-3.23 6.46-6.3 6.81.5.43.94 1.27.94 2.56v3.8c0 .36.25.8.95.66A13.8 13.8 0 0 0 20 6.5Z"/>
    
    <text x="58" y="15" fill="#F8FAFC" font-size="23" font-weight="750" letter-spacing="-0.5">ENGINEERING ACTIVITY</text>
    <text x="58" y="37" fill="#8B949E" font-size="12" font-weight="600" letter-spacing="1.5">PUBLIC GITHUB SIGNALS  •  VERIFIED JULY 2026</text>

    <!-- LIVE STATUS Pill -->
    <g transform="translate(928, 2)">
      <rect width="156" height="36" rx="18" fill="#080D16" fill-opacity="0.8" stroke="#1e293b" stroke-width="1.5"/>
      <rect width="156" height="36" rx="18" fill="none" stroke="url(#liveStatusBeam)" stroke-width="2" stroke-dasharray="50 330">
        <animate attributeName="stroke-dashoffset" values="380;0" dur="4s" repeatCount="indefinite" />
      </rect>
      <!-- Pulsing Green Dot -->
      <circle cx="21" cy="18" r="7" fill="#34D399" fill-opacity="0.25">
        <animate attributeName="r" values="5;9;5" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="21" cy="18" r="4" fill="#34D399">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="37" y="22" fill="#D1FAE5" font-size="11.5" font-weight="700" letter-spacing="1.2">LIVE PROFILE</text>
    </g>
  </g>

  <!-- Bento Grid Cards -->
  <g class="font-sans" transform="translate(48, 122)">
    <!-- Card 1: LIFETIME CONTRIBUTIONS -->
    <g transform="translate(0, 0)">
      <rect width="260" height="214" rx="20" fill="#080D16" fill-opacity="0.8" stroke="#1e293b" stroke-width="1.5"/>
      <rect width="260" height="214" rx="20" fill="none" stroke="url(#cardGoalBeam)" stroke-width="2" stroke-dasharray="80 860">
        <animate attributeName="stroke-dashoffset" values="940;0" dur="5s" repeatCount="indefinite" />
      </rect>
      <circle cx="42" cy="40" r="19" fill="#22D3EE" fill-opacity="0.1"/>
      <!-- Icon (Activity bars) -->
      <g transform="translate(0, 0)">
        <path d="M32 46V36 M37 46V30 M42 46V38 M47 46V32 M52 46V40" stroke="#22D3EE" stroke-width="1.8" stroke-linecap="round" fill="none"/>
        <circle cx="42" cy="40" r="14" stroke="#22D3EE" stroke-width="1" stroke-dasharray="2 3" fill="none"/>
      </g>
      <text x="26" y="105" fill="#F8FAFC" font-size="46" font-weight="800" letter-spacing="-1">6.1K+</text>
      <text x="26" y="135" fill="#C9D1D9" font-size="14.5" font-weight="700" letter-spacing="0.5">LIFETIME CONTRIBUTIONS</text>
      <text x="26" y="159" fill="#64748B" font-size="11.5">Public contribution record since 2020</text>
      <!-- Progress Bar -->
      <rect x="26" y="181" width="208" height="5" rx="2.5" fill="#172033"/>
      <rect x="26" y="181" width="196" height="5" rx="2.5" fill="url(#progressBarGrad)">
        <animate attributeName="width" values="0;196;196" keyTimes="0;0.75;1" dur="3s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Card 2: CONTRIBUTIONS IN 2026 -->
    <g transform="translate(280, 0)">
      <rect width="260" height="214" rx="20" fill="#080D16" fill-opacity="0.8" stroke="#1e293b" stroke-width="1.5"/>
      <rect width="260" height="214" rx="20" fill="none" stroke="url(#cardContribBeam)" stroke-width="2" stroke-dasharray="80 860">
        <animate attributeName="stroke-dashoffset" values="940;0" dur="5s" begin="1.25s" repeatCount="indefinite" />
      </rect>
      <circle cx="42" cy="40" r="19" fill="#60A5FA" fill-opacity="0.1"/>
      <!-- Icon (Growth graph) -->
      <g transform="translate(0, 0)">
        <path d="M32 45L38 39L44 42L52 33" stroke="#60A5FA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <path d="M47 33H52V38" stroke="#60A5FA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <circle cx="42" cy="40" r="14" stroke="#60A5FA" stroke-width="1" stroke-dasharray="2 3" fill="none"/>
      </g>
      <text x="26" y="105" fill="#F8FAFC" font-size="46" font-weight="800" letter-spacing="-1">575+</text>
      <text x="26" y="135" fill="#C9D1D9" font-size="14.5" font-weight="700" letter-spacing="0.5">CONTRIBUTIONS IN 2026</text>
      <text x="26" y="159" fill="#64748B" font-size="11.5">Live total continues to update below</text>
      <!-- Progress Bar -->
      <rect x="26" y="181" width="208" height="5" rx="2.5" fill="#172033"/>
      <rect x="26" y="181" width="177" height="5" rx="2.5" fill="url(#progressBarGrad)">
        <animate attributeName="width" values="0;177;177" keyTimes="0;0.75;1" dur="3s" begin="0.3s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Card 3: YEARS ON GITHUB -->
    <g transform="translate(560, 0)">
      <rect width="260" height="214" rx="20" fill="#080D16" fill-opacity="0.8" stroke="#1e293b" stroke-width="1.5"/>
      <rect width="260" height="214" rx="20" fill="none" stroke="url(#cardClockBeam)" stroke-width="2" stroke-dasharray="80 860">
        <animate attributeName="stroke-dashoffset" values="940;0" dur="5s" begin="2.5s" repeatCount="indefinite" />
      </rect>
      <circle cx="42" cy="40" r="19" fill="#818CF8" fill-opacity="0.1"/>
      <!-- Icon (Clock) -->
      <g transform="translate(0, 0)">
        <circle cx="42" cy="40" r="10" stroke="#818CF8" stroke-width="1.5" fill="none"/>
        <path d="M42 34V40H47" stroke="#818CF8" stroke-width="1.5" stroke-linecap="round" fill="none"/>
        <circle cx="42" cy="40" r="14" stroke="#818CF8" stroke-width="1" stroke-dasharray="2 3" fill="none"/>
      </g>
      <text x="26" y="105" fill="#F8FAFC" font-size="46" font-weight="800" letter-spacing="-1">6 YEARS</text>
      <text x="26" y="135" fill="#C9D1D9" font-size="14.5" font-weight="700" letter-spacing="0.5">BUILDING ON GITHUB</text>
      <text x="26" y="159" fill="#64748B" font-size="11.5">Long-term engineering activity</text>
      <!-- Progress Bar -->
      <rect x="26" y="181" width="208" height="5" rx="2.5" fill="#172033"/>
      <rect x="26" y="181" width="158" height="5" rx="2.5" fill="url(#progressBarGrad)">
        <animate attributeName="width" values="0;158;158" keyTimes="0;0.75;1" dur="3s" begin="0.6s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Card 4: ENGINEERING LEADERSHIP -->
    <g transform="translate(840, 0)">
      <rect width="260" height="214" rx="20" fill="#080D16" fill-opacity="0.8" stroke="#1e293b" stroke-width="1.5"/>
      <rect width="260" height="214" rx="20" fill="none" stroke="url(#cardLeaderBeam)" stroke-width="2" stroke-dasharray="80 860">
        <animate attributeName="stroke-dashoffset" values="940;0" dur="5s" begin="3.75s" repeatCount="indefinite" />
      </rect>
      <circle cx="42" cy="40" r="19" fill="#A78BFA" fill-opacity="0.1"/>
      <!-- Icon (Leadership Building) -->
      <g transform="translate(0, 0)">
        <path d="M32 46V34L42 28L52 34V46 Z M37 46V38H47V46" stroke="#A78BFA" stroke-width="1.5" stroke-linejoin="round" fill="none"/>
        <circle cx="42" cy="40" r="14" stroke="#A78BFA" stroke-width="1" stroke-dasharray="2 3" fill="none"/>
      </g>
      <text x="26" y="105" fill="#F8FAFC" font-size="34" font-weight="800" letter-spacing="-0.5">TWIINIFY</text>
      <text x="26" y="135" fill="#C9D1D9" font-size="14.5" font-weight="700" letter-spacing="0.5">ENGINEERING LEADERSHIP</text>
      <text x="26" y="159" fill="#64748B" font-size="11.5">Product, platform, &amp; team ownership</text>
      <!-- Progress Bar -->
      <rect x="26" y="181" width="208" height="5" rx="2.5" fill="#172033"/>
      <rect x="26" y="181" width="208" height="5" rx="2.5" fill="url(#progressBarGrad)">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- Footer Divider and Text -->
  <g transform="translate(48, 360)">
    <!-- Dotted Divider Path (Animated) -->
    <path d="M0 10H1104" stroke="#1e293b" stroke-dasharray="4 8">
      <animate attributeName="stroke-dashoffset" values="48;0" dur="5s" repeatCount="indefinite"/>
    </path>
    <!-- Glowing Endpoints -->
    <circle cx="0" cy="10" r="3.5" fill="#22D3EE" filter="url(#softGlow)"/>
    <circle cx="1104" cy="10" r="3.5" fill="#A78BFA" filter="url(#softGlow)"/>
    <text x="552" y="38" text-anchor="middle" fill="#8B949E" class="font-sans" font-size="12" font-weight="600" letter-spacing="1.5">CONSISTENT DELIVERY  •  PRODUCT OWNERSHIP  •  RELIABLE SYSTEMS  •  CONTINUOUS LEARNING</text>
  </g>

  <!-- Outer Border Beam (Glow Ring) -->
  <rect x="0.5" y="0.5" width="1199" height="419" rx="24" fill="none" stroke="url(#outerBorderBeam)" stroke-width="2" stroke-dasharray="250 1400">
    <animate attributeName="stroke-dashoffset" values="1650;0" dur="10s" repeatCount="indefinite" />
  </rect>
  <rect x="0.75" y="0.75" width="1198.5" height="418.5" rx="23.25" stroke="#1e293b" stroke-width="1.5" stroke-opacity="0.6"/>
</svg>
